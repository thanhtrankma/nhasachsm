<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Quản trị website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/theme.js"></script>
  <style type="text/tailwindcss">
  @layer components {
    .field { @apply block min-h-[44px] w-full rounded-lg border-2 border-line bg-card px-3 py-2.5 text-base text-fg placeholder-slate-400 transition-colors duration-150; }
    .field:focus { @apply border-primary outline-none; }
    .btn { @apply inline-flex min-h-[44px] cursor-pointer items-center justify-center gap-2 whitespace-nowrap rounded-lg px-4 py-2 font-semibold transition-colors duration-150 disabled:cursor-not-allowed disabled:opacity-50; }
    .btn-accent { @apply btn bg-accent text-white hover:bg-accent-hover; }
    .btn-primary { @apply btn bg-primary text-white hover:bg-primary-hover; }
    .btn-outline { @apply btn border-2 border-line bg-card text-fg hover:border-primary hover:text-primary; }
    .btn-ghost { @apply btn text-muted-fg hover:bg-bg hover:text-fg; }
    .btn-icon { @apply grid h-10 w-10 cursor-pointer place-items-center rounded-lg text-muted-fg transition-colors duration-150 hover:bg-bg hover:text-fg disabled:cursor-not-allowed disabled:opacity-30; }
    .card { @apply rounded-2xl border-2 border-line bg-card; }
    .nav-item { @apply flex min-h-[44px] w-full cursor-pointer items-center gap-3 whitespace-nowrap rounded-lg px-3 py-2 text-left font-medium text-fg transition-colors duration-150 hover:bg-bg; }
    .nav-item[aria-current="page"] { @apply bg-primary text-white hover:bg-primary; }
    .lbl { @apply block font-semibold text-fg; }
    .help { @apply text-sm text-muted-fg; }
  }
  </style>
</head>
<body class="min-h-screen bg-bg font-sans text-base text-muted-fg antialiased">

<!-- ================= LOGIN ================= -->
<main id="loginView" class="grid min-h-screen place-items-center p-4" hidden>
  <form id="loginForm" class="card w-full max-w-sm p-6 sm:p-8">
    <span class="grid h-12 w-12 place-items-center rounded-xl bg-primary text-white"><i data-icon="user" class="h-6 w-6"></i></span>
    <h1 class="mt-4 text-2xl font-extrabold text-fg">Đăng nhập quản trị</h1>
    <p id="loginHint" class="mt-1 text-sm">Nhập mật khẩu để chỉnh sửa nội dung website.</p>
    <label for="password" class="lbl mt-6">Mật khẩu</label>
    <input id="password" type="password" autocomplete="current-password" class="field mt-1.5" required />
    <p id="loginError" class="mt-2 text-sm font-medium text-danger" role="alert" hidden></p>
    <button class="btn-primary mt-6 w-full" type="submit">Đăng nhập</button>
    <a href="/" class="btn-ghost mt-2 w-full">← Về trang chủ</a>
  </form>
</main>

<!-- ================= APP ================= -->
<div id="appView" hidden>
  <header class="sticky top-0 z-30 border-b-2 border-line bg-card">
    <div class="flex h-16 items-center gap-3 px-4">
      <span class="grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-primary text-white"><i data-icon="sparkles" class="h-5 w-5"></i></span>
      <div class="min-w-0 flex-1">
        <p class="truncate font-extrabold text-fg">Quản trị website</p>
        <p id="saveStatus" class="truncate text-xs" aria-live="polite">Đã lưu</p>
      </div>
      <a href="/" target="_blank" rel="noopener" class="btn-ghost hidden sm:inline-flex"><i data-icon="external" class="h-5 w-5"></i>Xem trang</a>
      <button id="saveBtn" type="button" class="btn-accent" disabled><i data-icon="save" class="h-5 w-5"></i><span class="hidden sm:inline">Lưu thay đổi</span><span class="sm:hidden">Lưu</span></button>
      <button id="logoutBtn" type="button" class="btn-icon" aria-label="Đăng xuất" title="Đăng xuất"><i data-icon="logout" class="h-5 w-5"></i></button>
    </div>
    <!-- mobile nav -->
    <nav id="navMobile" class="flex gap-1 overflow-x-auto border-t border-line px-2 py-2 lg:hidden" aria-label="Mục quản trị"></nav>
  </header>

  <div class="mx-auto flex max-w-7xl gap-6 px-4 py-6">
    <aside class="hidden w-64 shrink-0 lg:block">
      <nav id="navDesktop" class="card sticky top-24 space-y-1 p-2" aria-label="Mục quản trị"></nav>
    </aside>
    <main id="panel" class="min-w-0 flex-1 pb-24"></main>
  </div>
</div>

<!-- Media library -->
<div id="mediaModal" class="fixed inset-0 z-50 hidden items-end justify-center bg-slate-900/60 p-0 sm:items-center sm:p-4" role="dialog" aria-modal="true" aria-labelledby="mediaTitle">
  <div class="flex max-h-[90vh] w-full max-w-3xl flex-col rounded-t-2xl bg-card sm:rounded-2xl">
    <div class="flex items-center justify-between border-b-2 border-line p-4">
      <h2 id="mediaTitle" class="text-lg font-bold text-fg">Thư viện ảnh</h2>
      <button type="button" class="btn-icon" data-close-media aria-label="Đóng"><i data-icon="close" class="h-5 w-5"></i></button>
    </div>
    <div id="mediaGrid" class="grid grid-cols-3 gap-2 overflow-y-auto p-4 sm:grid-cols-5"></div>
  </div>
</div>

<!-- Toasts -->
<div id="toasts" class="pointer-events-none fixed bottom-4 left-1/2 z-[60] flex w-[calc(100%-2rem)] max-w-md -translate-x-1/2 flex-col gap-2" aria-live="polite"></div>

<script src="assets/js/icons.js"></script>

/* ================== HELPERS ================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const vnd = n => Number(n || 0).toLocaleString('vi-VN') + 'đ';
const clone = o => JSON.parse(JSON.stringify(o));
const getPath = (o, p) => p.split('.').reduce((a, k) => a?.[k], o);
function setPath(o, p, v) {
  const ks = p.split('.'); const last = ks.pop();
  const parent = ks.reduce((a, k) => (a[k] ??= {}), o);
  parent[last] = v;
}
const fmtTime = iso => iso ? new Date(iso).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' }) : '';
const fmtDate = d => d ? new Date(d + 'T00:00').toLocaleDateString('vi-VN') : '';

async function api(path, opts = {}) {
  const res = await fetch(path, {
    credentials: 'same-origin', ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    body: opts.body && typeof opts.body !== 'string' ? JSON.stringify(opts.body) : opts.body,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== '/api/login') { showLogin(); throw new Error('Phiên đăng nhập đã hết hạn'); }
  if (!res.ok) throw new Error(data.error || `Lỗi ${res.status}`);
  return data;
}

function toast(msg, kind = 'ok') {
  const el = document.createElement('div');
  el.className = `pointer-events-auto flex items-center gap-2 rounded-xl px-4 py-3 font-semibold text-white ${kind === 'err' ? 'bg-danger' : 'bg-fg'}`;
  el.innerHTML = iconSvg(kind === 'err' ? 'alert' : 'check') + `<span>${esc(msg)}</span>`;
  $('#toasts').append(el);
  setTimeout(() => el.remove(), kind === 'err' ? 6000 : 3000);
}

/* ================== STATE ================== */
let draft = null, savedJSON = '', view = 'brand', bookings = [], bookingFilter = 'all', bookingQuery = '';
const openItems = new Set();
const isDirty = () => draft && JSON.stringify(draft) !== savedJSON;

function markDirty() {
  const d = isDirty();
  $('#saveBtn').disabled = !d;
  $('#saveStatus').textContent = d ? '● Có thay đổi chưa lưu' : 'Đã lưu';
  $('#saveStatus').className = `truncate text-xs ${d ? 'font-semibold text-accent' : ''}`;
}

/* ================== NAV ================== */
function renderNav() {
  const newCount = bookings.filter(b => b.status === 'new').length;
  const item = v => `
    ${v.divider ? '<hr class="my-2 border-line" />' : ''}
    <button type="button" class="nav-item" data-view="${v.id}" ${v.id === view ? 'aria-current="page"' : ''}>
      ${iconSvg(v.icon)}<span class="flex-1">${esc(v.title)}</span>
      ${v.id === 'bookings' && newCount ? `<span class="rounded-full bg-accent px-2 text-xs font-bold text-white">${newCount}</span>` : ''}
    </button>`;
  $('#navDesktop').innerHTML = VIEWS.map(item).join('');
  $('#navMobile').innerHTML = VIEWS.map(v => item({ ...v, divider: false })).join('');
  $('#navMobile [aria-current]')?.scrollIntoView({ inline: 'nearest', block: 'nearest' });
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-view]');
  if (!b) return;
  view = b.dataset.view;
  renderNav(); renderPanel();
  window.scrollTo({ top: 0 });
});

/* ================== FIELD RENDERERS ================== */
const fid = p => 'f_' + p.replace(/[^\w]/g, '_');

function wrap(f, path, control) {
  return `<div class="space-y-1.5 ${f.half ? 'sm:col-span-1' : 'sm:col-span-2'}">
    ${f.t === 'bool' ? '' : `<label class="lbl" for="${fid(path)}">${esc(f.l)}</label>`}
    ${control}
    ${f.help ? `<p class="help">${esc(f.help)}</p>` : ''}
  </div>`;
}

function imagePreview(src) {
  return src
    ? `<img src="${esc(src)}" alt="" class="h-full w-full object-cover" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'text-xs text-danger p-2 text-center',textContent:'Không tìm thấy ảnh'}))" />`
    : iconSvg('image', 'h-8 w-8 text-slate-400');
}

function fieldHTML(f, base = '') {
  const path = base ? `${base}.${f.k}` : f.k;
  const v = getPath(draft, path);
  const id = fid(path);
  switch (f.t) {
    case 'textarea':
      return wrap(f, path, `<textarea id="${id}" class="field" rows="3" data-path="${path}">${esc(v)}</textarea>`);
    case 'money':
      return wrap(f, path, `<div class="relative">

function itemSummary(f, item, i) {
  const label = esc(item?.[f.sum] || `Mục ${i + 1}`);
  const thumb = f.thumb && item?.[f.thumb] ? `<img src="${esc(item[f.thumb])}" alt="" class="h-9 w-12 shrink-0 rounded object-cover" />` : '';
  const icon = item?.icon ? iconSvg(item.icon, 'h-5 w-5 text-primary') : '';
  let extra = '';
  if ('price' in (item || {})) {
    const d = item.original > 0 ? Math.round((1 - item.price / item.original) * 100) : 0;
    extra = `<span class="ml-2 font-normal text-muted-fg">${vnd(item.price)}${d > 0 ? ` · −${d}%` : ''}${item.popular ? ' · Phổ biến' : ''}</span>`;
  }
  return `<span class="flex items-center gap-2">${thumb}${icon}<span class="truncate">${label}${extra}</span></span>`;
}

function findListField(path) {
  // path like "pricing.packages" or "pricing.packages.0.features"
  const walk = (fields, base) => {
    for (const f of fields) {
      const p = base ? `${base}.${f.k}` : f.k;
      if (p === path) return f;
      if (f.t === 'list' && path.startsWith(p + '.')) {
        const rest = path.slice(p.length + 1).split('.');
        const found = walk(f.fields, `${p}.${rest[0]}`);
        if (found) return found;
      }
    }
  };
  for (const s of SECTIONS) { const f = walk(s.fields, ''); if (f) return f; }
}

/* ================== UPLOAD & MEDIA ================== */
function readDataURL(blob) {
  return new Promise((ok, fail) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = fail; r.readAsDataURL(blob); });
}
const MAX_UPLOAD_CHARS = 4_000_000; // Vercel caps request bodies at 4.5MB (base64 adds ~33%)
async function prepareImage(file, maxSide = 1800, square = false) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) throw new Error('Chỉ nhận ảnh JPG, PNG hoặc WebP');
  const bmp = await createImageBitmap(file);
  // Square fields (favicon) are centre-cropped so browsers never stretch them.
  const side = Math.min(bmp.width, bmp.height);
  const src = square ? { x: (bmp.width - side) / 2, y: (bmp.height - side) / 2, w: side, h: side } : { x: 0, y: 0, w: bmp.width, h: bmp.height };
  let max = maxSide, quality = 0.85;
  if (!(square && bmp.width !== bmp.height) && Math.max(src.w, src.h) <= max && file.size < 1.5e6) return readDataURL(file);
  // Shrink until it fits; PNG keeps transparency, others become JPEG.
  for (let tries = 0; tries < 6; tries++) {
    const scale = Math.min(1, max / Math.max(src.w, src.h));
    const cv = Object.assign(document.createElement('canvas'), { width: Math.round(src.w * scale), height: Math.round(src.h * scale) });
    cv.getContext('2d').drawImage(bmp, src.x, src.y, src.w, src.h, 0, 0, cv.width, cv.height);
    const url = cv.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', quality);
    if (url.length < MAX_UPLOAD_CHARS) return url;
    max = Math.round(max * 0.75); quality = Math.max(0.6, quality - 0.1);
  }
  throw new Error('Ảnh quá lớn, vui lòng chọn ảnh nhỏ hơn');
}

function validateDraft() {
  const pk = draft.pricing?.packages || [];
  for (const p of pk) {
    if (!p.name?.trim()) return 'Mỗi gói giá cần có tên';
    if (p.price > p.original && p.original > 0) return `Gói “${p.name}”: giá ưu đãi đang cao hơn giá gốc`;
  }
  if (!draft.services?.items?.length) return 'Cần ít nhất 1 dịch vụ khảo sát';
  if (draft.services.items.some(s => !s.name?.trim())) return 'Mỗi dịch vụ cần có tên';
  return '';
}
async function save() {
  if (!isDirty()) return;
  const err = validateDraft();
  if (err) return toast(err, 'err');
  const btn = $('#saveBtn');
  btn.disabled = true; $('#saveStatus').textContent = 'Đang lưu…';
  try {
    await api('/api/content', { method: 'PUT', body: draft });
    savedJSON = JSON.stringify(draft);
    toast('Đã lưu – trang web đã được cập nhật');
  } catch (e) { toast(e.message, 'err'); }
  markDirty();
}
$('#saveBtn').addEventListener('click', save);

});

    const id = del.closest('[data-bk]').dataset.bk, b = bookings.find(x => x.id === id);
    if (!confirm(`Xoá vĩnh viễn đơn của ${b.name} (${b.phone})?`)) return;
    try { await api('/api/bookings?id=' + encodeURIComponent(id), { method: 'DELETE' }); bookings = bookings.filter(x => x.id !== id); renderNav(); renderBookings(); toast('Đã xoá đơn'); }
    catch (err) { toast(err.message, 'err'); }
  }
});
panel.addEventListener('change', e => {
  const st = e.target.closest('[data-bk-status]');
  if (!st) return;
  updateBooking(st.closest('[data-bk]').dataset.bk, { status: st.value }).then(() => { renderNav(); renderBookings(); });
});
panel.addEventListener('focusout', e => {
  const n = e.target.closest('[data-bk-note]');
  if (!n) return;
  const id = n.closest('[data-bk]').dataset.bk;
  if ((bookings.find(b => b.id === id)?.adminNote || '') !== n.value) updateBooking(id, { adminNote: n.value });
});
panel.addEventListener('input', e => {
  if (e.target.id !== 'bkSearch') return;
  bookingQuery = e.target.value;
  const pos = e.target.selectionStart;
  renderBookings();
  const s = $('#bkSearch'); s.focus(); s.setSelectionRange(pos, pos);
});
function exportCSV() {
  const cell = v => { let s = String(v ?? ''); if (/^[=+\-@]/.test(s)) s = "'" + s; return `"${s.replace(/"/g, '""')}"`; };
  const head = ['Mã', 'Đặt lúc', 'Trạng thái', 'Loại', 'Họ tên', 'SĐT', 'Địa chỉ', 'Dịch vụ / Gói', 'Tổng tiền', 'Ngày mong muốn', 'Khung giờ', 'Ghi chú KH', 'Ghi chú nội bộ'];
  const rows = filteredBookings().map(b => [b.id, fmtTime(b.createdAt), STATUS[b.status]?.l, b.type === 'survey' ? 'Khảo sát' : 'Combo', b.name, b.phone, b.address,
    b.type === 'survey' ? b.service : b.items.map(i => `${i.name} x${i.qty}`).join('; '), b.total ?? '', fmtDate(b.date), b.slot, b.note, b.adminNote]);
  const csv = '﻿' + [head, ...rows].map(r => r.map(cell).join(',')).join('\r\n');
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), download: `don-dat-lich-${new Date().toISOString().slice(0, 10)}.csv` });
  a.click(); URL.revokeObjectURL(a.href);
}

/* ================== ACCOUNT ================== */
async function renderAccount() {
  $('#panel').innerHTML = `
    <div class="mb-5"><h1 class="text-2xl font-extrabold text-fg">Mật khẩu & sao lưu</h1></div>
    <form id="pwForm" class="card grid gap-4 p-5 sm:p-6">
      <h2 class="text-lg font-bold text-fg">Đổi mật khẩu</h2>
      <div><label class="lbl" for="pwCur">Mật khẩu hiện tại</label><input id="pwCur" type="password" autocomplete="current-password" class="field mt-1.5" required /></div>
      <div class="grid gap-4 sm:grid-cols-2">
        <div><label class="lbl" for="pwNew">Mật khẩu mới</label><input id="pwNew" type="password" autocomplete="new-password" minlength="8" class="field mt-1.5" required /><p class="help mt-1">Tối thiểu 8 ký tự.</p></div>
        <div><label class="lbl" for="pwNew2">Nhập lại mật khẩu mới</label><input id="pwNew2" type="password" autocomplete="new-password" class="field mt-1.5" required /></div>
      </div>
      <div><button class="btn-primary" type="submit">Đổi mật khẩu</button></div>
    </form>
    <section class="card mt-6 p-5 sm:p-6">
      <h2 class="text-lg font-bold text-fg">Bản sao lưu nội dung</h2>
      <p class="help mt-1">Mỗi lần bấm Lưu, bản cũ được giữ lại (tối đa 30 bản). Khôi phục sẽ thay toàn bộ nội dung hiện tại.</p>
      <ul id="backupList" class="mt-4 divide-y-2 divide-line"><li class="py-3">Đang tải…</li></ul>
    </section>`;
  try {
    const { items } = await api('/api/backups');
    $('#backupList').innerHTML = items.length ? items.map(b => `
      <li class="flex items-center justify-between gap-3 py-3">
        <span><b class="text-fg">${fmtTime(b.time)}</b> <span class="text-sm">· ${(b.size / 1024).toFixed(1)} KB</span></span>
        <button type="button" class="btn-outline !min-h-[40px] text-sm" data-restore="${esc(b.id)}">${iconSvg('refresh', 'h-4 w-4')}Khôi phục</button>
      </li>`).join('') : '<li class="py-3">Chưa có bản sao lưu nào.</li>';
  } catch (e) { $('#backupList').innerHTML = `<li class="py-3 text-danger">${esc(e.message)}</li>`; }
}
panel.addEventListener('submit', async e => {
  if (e.target.id !== 'pwForm') return;
  e.preventDefault();
  const cur = $('#pwCur').value, n1 = $('#pwNew').value, n2 = $('#pwNew2').value;
  if (n1.length < 8) return toast('Mật khẩu mới cần ít nhất 8 ký tự', 'err');
  if (n1 !== n2) return toast('Hai mật khẩu mới không khớp', 'err');
  try { await api('/api/password', { method: 'POST', body: { current: cur, new: n1 } }); e.target.reset(); toast('Đã đổi mật khẩu'); }
  catch (err) { toast(err.message, 'err'); }
});
panel.addEventListener('click', async e => {
  const r = e.target.closest('[data-restore]');
  if (!r) return;
  if (isDirty() && !confirm('Bạn có thay đổi chưa lưu, chúng sẽ bị mất. Tiếp tục?')) return;
  if (!confirm('Khôi phục nội dung về bản sao lưu này?')) return;
  try {
    const res = await api('/api/backups', { method: 'POST', body: { id: r.dataset.restore } });
    draft = res.content; savedJSON = JSON.stringify(draft); markDirty();
    toast('Đã khôi phục'); renderAccount();
  } catch (err) { toast(err.message, 'err'); }
});

/* ================== AUTH & BOOT ================== */
function showLogin(hint) {
  $('#appView').hidden = true; $('#loginView').hidden = false;
  if (hint) { $('#loginHint').innerHTML = hint; }
  $('#password').focus();
}
async function showApp() {
  $('#loginView').hidden = true; $('#appView').hidden = false;
  draft = await api('/api/content');
  savedJSON = JSON.stringify(draft);
  await loadBookings();
  renderNav(); renderPanel(); markDirty();
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = $('#loginError'); err.hidden = true;
  try { await api('/api/login', { method: 'POST', body: { password: $('#password').value } }); $('#password').value = ''; showApp(); }
  catch (ex) { err.textContent = ex.message; err.hidden = false; }
});
$('#logoutBtn').addEventListener('click', async () => {
  if (isDirty() && !confirm('Bạn có thay đổi chưa lưu. Vẫn đăng xuất?')) return;
  await api('/api/logout', { method: 'POST' }).catch(() => {});
  savedJSON = JSON.stringify(draft); location.reload();
});
setInterval(() => { if (!$('#appView').hidden && view === 'bookings' && document.visibilityState === 'visible' && !panel.contains(document.activeElement)) loadBookings().then(renderBookings); }, 60000);

(async () => {
  hydrateIcons();
  try {
    const s = await api('/api/session');
    if (s.authed) return showApp();
    if (s.storage === 'none') return showLogin('<span class="text-danger">Chưa cấu hình Supabase. Thêm SUPABASE_URL và SUPABASE_SECRET_KEY trong Vercel → Settings → Environment Variables rồi Redeploy.</span>');
    showLogin(s.passwordSet ? '' : 'Chưa có mật khẩu admin. Vào Vercel → Settings → Environment Variables, thêm <code class="rounded bg-muted px-1.5 py-0.5 text-fg">ADMIN_PASSWORD</code> (≥ 8 ký tự) rồi Redeploy.');
  } catch {
    showLogin('<span class="text-danger">Không kết nối được API. Trên máy, hãy chạy <code>npm run dev</code>.</span>');
  }
})();
</script>
